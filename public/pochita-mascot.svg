<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Pochita SLK Editor mascot</title>
  <desc id="desc">An original cute orange puppy mascot with mint and navy accents.</desc>
  <!-- Transparent canvas; the rounded tile makes the mark legible as a favicon. -->
  <rect x="36" y="36" width="952" height="952" rx="206" fill="#202734" stroke="#36415A" stroke-width="18"/>
  <circle cx="515" cy="490" r="330" fill="#E0F8C7"/>
